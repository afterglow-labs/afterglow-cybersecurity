name: detections
# On pushes and PRs that change Sigma rules, Suricata rules, or ATT&CK layers,
# reproducible tests check that rules fire, convert across SIEM backends, match
# coverage layers, retain upstream indicator alignment, and pass the full
# SigmaHQ convention checks. Changing rules without updating tests or layers
# fails this merge gate. It enforces the eight-test contribution contract in
# CONTRIBUTING.md and detections/tests/README.md; ci.yml handles Go checks.
# Three additional gates are separate from those eight rule tests: harness
# registry synchronization, the host triage self-test
# (detections/triage/artex_host_triage.py), and consistency of inline Sigma
# correlation templates described in docs/defense-{ko,en}.md. run-all.sh runs
# all three. The template gate reproduces the guides' claims: `sigma check`
# passes, Splunk/EQL/Loki conversion works, Lucene/Kusto correlation is
# unsupported, and the Korean and English rule bodies match. It catches prose
# that becomes stale when upstream sigma-cli or backends change.
#
# Docker is sufficient for the eight tests; ubuntu-latest already provides it.
# The runner downloads sigma-cli, scapy, Suricata, and Python images and runs
# them in isolated containers. It installs nothing on the runner and mounts
# the rule tree and indicator source files read-only without writing to Git.
# Run this workflow when detections/ changes or when indicator tests' pinned
# sources change: User-Agent strings, markers, and destructive-command tokens
# in enrich, selfupdate, guard, and db; default listener/proxy ports in
# cmd/artex/main.go; the MITM CA filename in traffic/traffic.go; and the
# exploration-graph schema fingerprint in db/schema.sql. These triggers catch
# source changes that would silently stale rules or indicator lists. Pulling
# public Docker images without authentication can rarely hit a Docker Hub
# rate limit; rerun the job if that happens.
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      # The defense-template gate reads both files; recheck when either changes.
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# Cancel the previous run for this branch so frequent pushes do not queue work.
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check harness registry synchronization (run-all.sh, CI, directories)
        run: detections/tests/check-harness-sync.sh
      - name: Self-test host triage tool (artex_host_triage.py)
        run: detections/tests/triage-selftest.sh
      - name: Check inline Sigma templates in defense guides (conversion and ko/en parity)
        run: detections/tests/check-defense-template.sh
      - name: Reproduce Sigma rules (validation, backend conversion, indicator retention)
        run: detections/tests/sigma/run.sh
      - name: Match Sigma rules against malicious and benign event samples
        run: detections/tests/sigma_match/run.sh
      - name: Lint Sigma rules against documented SigmaHQ conventions
        run: detections/tests/sigma_lint/run.sh
      - name: Check Sigma correlation conversion across backends
        run: detections/tests/sigma_backends/run.sh
      - name: Reproduce Suricata alerts from synthetic pcap samples
        run: detections/tests/suricata/run.sh
      - name: Check ATT&CK layers against rules
        run: detections/tests/attack/run.sh
      - name: Check detection indicators against upstream sources
        run: detections/tests/indicators/run.sh
      - name: Check MISP export and CSV parity with pymisp
        run: detections/tests/misp/run.sh
