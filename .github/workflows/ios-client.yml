name: iOS client
on:
  workflow_dispatch:
  pull_request:
    paths: ['clients/ios/**', '.github/workflows/ios-client.yml']
  push:
    branches: [main]
    paths: ['clients/ios/**', '.github/workflows/ios-client.yml']
permissions:
  contents: read
jobs:
  ios-client:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Check native language coverage
        run: python3 clients/ios/scripts/check-localizations.py
      - name: Select and boot a simulator
        env:
          APTEX_DEVICE: ${{ matrix.device }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j'],text=True))
          devices=[device for runtime,items in data['devices'].items() if 'iOS' in runtime for device in items if device['name'].startswith(os.environ['APTEX_DEVICE'])]
          assert devices, 'No requested iOS simulator is available'
          device=devices[0]
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('APTEX_SIMULATOR='+device['udid']+'\n')
          if device['state']!='Booted': subprocess.run(['xcrun','simctl','boot',device['udid']],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',device['udid'],'-b'],check=True)
          PY
      - name: Run native unit, protocol and UI tests
        run: clients/ios/scripts/test.sh "$APTEX_SIMULATOR"
      - name: Package device client for Feather
        if: matrix.device == 'iPhone'
        env:
          APTEX_SOURCE_REVISION: ${{ github.sha }}
        run: clients/ios/scripts/package.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: APTEX-iOS-${{ matrix.device }}
          path: |
            clients/ios/build/*.xcresult
            clients/ios/build/fixture.log
            clients/ios/build/release/*.ipa
            clients/ios/build/release/SHA256SUMS.txt
          if-no-files-found: error
